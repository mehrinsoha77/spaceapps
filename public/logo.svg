<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SHELTER logo: a heartbeat line inside a shield, circled by an orbit">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="75%">
      <stop offset="0" stop-color="#1D2E66"/>
      <stop offset="0.55" stop-color="#0B1232"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
    <radialGradient id="nebula" cx="78%" cy="18%" r="45%">
      <stop offset="0" stop-color="#FF4FA3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FD4FF"/>
      <stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FD4FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2FD4FF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#nebula)"/>
  <g fill="#FFFFFF">
    <circle cx="82" cy="92" r="2.6" opacity="0.9"/>
    <circle cx="140" cy="54" r="1.6" opacity="0.6"/>
    <circle cx="430" cy="118" r="2.2" opacity="0.8"/>
    <circle cx="396" cy="62" r="1.4" opacity="0.6"/>
    <circle cx="66" cy="214" r="1.6" opacity="0.5"/>
    <circle cx="452" cy="404" r="2" opacity="0.7"/>
    <circle cx="104" cy="442" r="1.6" opacity="0.6"/>
    <circle cx="300" cy="470" r="1.3" opacity="0.5"/>
  </g>
  <path d="M410 150 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z" fill="#BDEFFF" filter="url(#soft)"/>
  <!-- orbit, back half (behind the shield) -->
  <ellipse cx="256" cy="276" rx="214" ry="62" transform="rotate(-16 256 276)" fill="none" stroke="#2FD4FF" stroke-opacity="0.35" stroke-width="7"/>
  <!-- shield -->
  <path d="M256 92 L380 138 V250 C380 338 324 398 256 424 C188 398 132 338 132 250 V138 Z"
        fill="url(#shieldFill)" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round" filter="url(#soft)"/>
  <!-- heartbeat -->
  <path d="M150 262 H210 L230 214 L256 322 L282 186 L302 262 H362" fill="none" stroke="#F2FBFF" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- orbit, front half (over the shield) -->
  <path d="M461.6 228.3 A214 62 -16 0 1 56.4 344.4" fill="none" stroke="#2FD4FF" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>
  <!-- planet -->
  <circle cx="373.7" cy="298.1" r="15" fill="#FFB020" filter="url(#glow)"/>
</svg>
